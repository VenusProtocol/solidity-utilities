name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  release:
    # The "release" environment is limited to the release branches.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag and create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v3
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"

      - name: Install dependencies
        # Hack to get around failing "ethereumjs-abi The remote archive doesn't match the expected checksum" error
        run: YARN_CHECKSUM_BEHAVIOR=update yarn

      - name: Build
        run: yarn build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn semantic-release
